# ================================================================
# Phylogenetically-Conditioned Latent Diffusion for Avian Skulls
# ================================================================

data:
  stl_dir: "./dataset_watertight"
  processed_dir: "./data/processed"
  size_file: "./size.xlsx"
  phylo_file: "./phylo_distances.csv"   # Phylogenetic distance matrix (optional, auto-generated if missing)
  num_sdf_samples: 100000
  surface_ratio: 0.5

deepsdf:
  latent_dim: 64
  hidden_dim: 512
  num_layers: 8
  skip_connection: [4]
  weight_norm: true
  latent_reg_weight: 1.0e-3
  phylo_reg_weight: 5.0e-3              # NEW: phylogenetic consistency loss weight
  clamping_distance: 0.1
  lr_decoder: 5.0e-4
  lr_latent: 1.0e-3
  epochs: 2000
  batch_size: 16384
  checkpoint_every: 200
  lr_schedule_step: 500
  lr_schedule_gamma: 0.5

augmentation:
  enable: true
  num_augmented_per_specimen: 10         # Generate 10 augmented codes per real code
  arap_noise_std: 0.1                    # Noise scale — was 0.3 but real codes have std=0.09
  interpolation_samples: 5              # Interpolated codes between each species pair
  total_target: 2000                     # Target augmented dataset size

diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  beta_schedule: "cosine"
  model_dim: 256                         # Full CFM (kept for backward compat)
  num_layers: 4
  residual_model_dim: 128                # Residual CFM — smaller since task is easier
  residual_num_layers: 3
  phylo_embed_dim: 32
  condition_on_species: true
  condition_on_size: true
  condition_on_phylo: true
  dropout: 0.05
  lr: 1.0e-4
  epochs: 10000
  batch_size: 256
  checkpoint_every: 1000
  var_weight: 0.1                        # Variance preservation penalty

generation:
  num_samples: 20
  marching_cubes_resolution: 256
  diffusion_steps: 1000
  guidance_scale: 1.5
  temperature: 1.2
  output_dir: "./output/generated_stl"

evaluation:
  num_eval_samples: 100                  # For quantitative metrics
  output_dir: "./output/evaluation"

compute:
  device: "cuda"
  num_workers: 8
  seed: 42
